<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Rooms | L-Rina Apartment</title>
		<meta name="description" content="Explore rooms and apartments at L-Rina Apartment in Lagos.">
		<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
		<link rel="stylesheet" href="css/styles.css">
	</head>
	<body data-page="rooms">
		  <header id="site-header"><div id="mobile-drawer" class="fixed inset-0 z-[100] invisible lg:hidden"><div id="mobile-overlay" class="absolute inset-0 bg-black/60 opacity-0"></div><div id="mobile-panel" class="absolute top-0 right-0 h-full w-[500px] max-w-[85vw] translate-x-full bg-white shadow-2xl"><div class="pt-24 px-6 flex flex-col gap-2"><a href="index.html" class="py-3 px-4 rounded-lg text-stone-700">Home</a><a href="rooms.html" class="py-3 px-4 rounded-lg text-stone-700">Rooms</a><a href="booking.html" class="py-3 px-4 rounded-lg text-stone-700">Book Now</a><a href="order.html" class="py-3 px-4 rounded-lg text-stone-700">Food &amp; Drinks</a><a href="gallery.html" class="py-3 px-4 rounded-lg text-stone-700">Gallery</a><a href="about.html" class="py-3 px-4 rounded-lg text-stone-700">About</a><a href="contact.html" class="py-3 px-4 rounded-lg text-stone-700">Contact</a><a href="booking.html" class="mt-4 rounded-lg bg-amber-600 px-4 py-3 text-center text-white">Book Your Stay</a></div></div></div></header>
		<main id="app">
			<section class="relative flex h-[420px] items-end bg-cover bg-center" style="background-image:url('https://images.pexels.com/photos/8135496/pexels-photo-8135496.jpeg?auto=compress&cs=tinysrgb&w=1800')">
				<div class="absolute inset-0 bg-black/45"></div>
				<div class="container-lr relative z-10 pb-16 text-white">
					<p class="section-subtitle text-amber-400">Find your room</p>
					<h1 class="font-serif text-6xl font-bold">Rooms &amp; Apartments</h1>
				</div>
			</section>
			<section class="py-20">
				<div class="container-lr">
					<div class="mb-10 flex flex-col justify-between gap-4 md:flex-row md:items-end">
						<div>
							<p class="section-subtitle">Stay your way</p>
							<h2 class="section-title">Choose your space</h2>
						</div>
						<form id="room-filter" class="flex flex-wrap gap-3">
							<label class="sr-only" for="room-guests">Guests</label>
							<select id="room-guests" name="guests" class="input-luxury w-auto">
								<option value="">Any guests</option>
								<option value="1">1+ guests</option>
								<option value="2">2+ guests</option>
								<option value="3">3+ guests</option>
								<option value="4">4+ guests</option>
							</select>
							<label class="sr-only" for="room-type">Room type</label>
							<select id="room-type" name="type" class="input-luxury w-auto">
								<option value="">All types</option>
							</select>
							<button class="btn-dark" type="submit">Filter</button>
						</form>
					</div>
					<div id="room-list" class="grid gap-8 md:grid-cols-2 lg:grid-cols-3"></div>
					<p id="room-empty" class="hidden rounded-xl bg-white p-10 text-center text-stone-600">No rooms match those preferences.</p>
				</div>
			</section>
		</main>
		<footer id="site-footer"></footer>
		<script type="module" src="js/main.js"></script>
	<button id="menu-toggle" class="fixed top-5 right-4 z-[110] lg:hidden text-3xl" aria-label="Toggle menu" aria-expanded="false">☰</button></body>
</html>
